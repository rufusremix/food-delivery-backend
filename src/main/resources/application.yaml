spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_store?createDatabaseIfNotExist=true
    username: root
    password: password

  flyway:
    enabled: true

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300 # 5m
    refreshTokenExpiration: 604800 # 7d


logging:
  level:
    org.flywaydb: INFO